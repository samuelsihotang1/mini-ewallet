server:
  port: 8082

spring:
  application:
    name: transfer-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/transfer_db
    username: ${DB_USER:transfer_svc}
    password: ${DB_PASSWORD:transfer_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
