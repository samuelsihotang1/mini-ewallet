server:
  port: 8082

spring:
  application:
    name: transfer-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/transfer_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USER:transfer_svc}
    password: ${DB_PASSWORD:transfer_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      auto-offset-reset: earliest
    listener:
      concurrency: 3

wallet-service:
  base-url: ${WALLET_SERVICE_URL:http://localhost:8081}

messaging:
  retry:
    dead-letter-suffix: .transfer-service.DLT

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
