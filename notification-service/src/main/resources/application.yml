server:
  port: 8083

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/notification_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USER:notification_svc}
    password: ${DB_PASSWORD:notification_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      auto-offset-reset: earliest
    listener:
      concurrency: 3

messaging:
  # This service publishes nothing, so it has no outbox to relay.
  outbox:
    enabled: false
  retry:
    # Must equal DeadLetterListener.SUFFIX.
    dead-letter-suffix: .notification-service.DLT

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
