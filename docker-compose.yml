name: mini-ewallet

x-service: &service
  build:
    context: .
  restart: unless-stopped
  environment: &service-env
    DB_HOST: mysql
    DB_PORT: "3306"
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  depends_on:
    mysql:
      condition: service_healthy
    kafka:
      condition: service_healthy
  deploy:
    resources:
      limits:
        memory: 512m

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # TCP, not the socket: during init the entrypoint runs a temporary server
      # with networking off, and a socket ping would pass before port 3306 opens.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=tcp", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:4.3.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: -Xmx384m -Xms384m
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30

  wallet-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE: wallet-service
    environment:
      <<: *service-env
      DB_USER: wallet_svc
      DB_PASSWORD: wallet_pass
      SERVER_PORT: "8081"
    ports:
      - "8081:8081"
    healthcheck: &service-health
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/$$SERVER_PORT && printf \"GET /actuator/health/readiness HTTP/1.0\r\n\r\n\" >&3 && grep -q UP <&3'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  transfer-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE: transfer-service
    environment:
      <<: *service-env
      DB_USER: transfer_svc
      DB_PASSWORD: transfer_pass
      SERVER_PORT: "8082"
    ports:
      - "8082:8082"
    healthcheck: *service-health

  notification-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE: notification-service
    environment:
      <<: *service-env
      DB_USER: notification_svc
      DB_PASSWORD: notification_pass
      SERVER_PORT: "8083"
    ports:
      - "8083:8083"
    healthcheck: *service-health

volumes:
  mysql-data:
