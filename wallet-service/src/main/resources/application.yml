server:
  port: 8081

spring:
  application:
    name: wallet-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/wallet_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USER:wallet_svc}
    password: ${DB_PASSWORD:wallet_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      auto-offset-reset: earliest
    listener:
      concurrency: 3

messaging:
  retry:
    dead-letter-suffix: .wallet-service.DLT

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
